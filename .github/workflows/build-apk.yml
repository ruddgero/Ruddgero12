name: Gerar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Criar arquivos auxiliares (Keystore e .env)
      run: |
        touch .env
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Baixar e Configurar Gradle
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
        unzip -q gradle-8.11.1-bin.zip
        ./gradle-8.11.1/bin/gradle wrapper
        chmod +x gradlew

    - name: Compilar APK Debug
      run: ./gradlew assembleDebug --stacktrace

    - name: Disponibilizar APK para Download
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: Controle-Financeiro-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
